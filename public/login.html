<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <title>登录 · Echo Study</title>
  <style>
    :root { color-scheme: dark; font-family: Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 22px; color: #f3f4f6; background: radial-gradient(circle at 35% 0,#24273a 0,#0b0c0f 48%); }
    main { width: min(420px,100%); padding: 34px; border: 1px solid #2d313b; border-radius: 24px; background: rgba(18,20,25,.94); box-shadow: 0 30px 90px rgba(0,0,0,.5); }
    .mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 24px; border-radius: 16px; background: #258df4; font-size: 22px; box-shadow: 0 12px 34px rgba(37,141,244,.3); }
    small { color: #8d939e; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 7px 0 8px; font-size: 30px; }
    p { margin: 0 0 25px; color: #969ca7; line-height: 1.6; }
    label { display: block; margin: 14px 0 7px; color: #c8cbd2; font-size: 13px; }
    input { width: 100%; border: 1px solid #343945; border-radius: 12px; background: #0b0d11; color: #fff; padding: 13px 14px; font: inherit; }
    input:focus { outline: 2px solid #75b9ff; outline-offset: 2px; }
    button { width: 100%; margin-top: 22px; border: 0; border-radius: 12px; background: #258df4; color: #fff; padding: 13px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 20px; margin: 13px 0 0; color: #ff8196; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">▶</div>
    <small>VIDEO IMMERSION</small>
    <h1>登录 Echo Study</h1>
    <p>登录后继续使用视频精听、自动字幕与四六级重点标记。</p>
    <form id="loginForm">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">登录</button>
      <p id="status" role="alert"></p>
    </form>
  </main>
  <script>
    fetch('/api/auth/me').then(response => { if (response.ok) location.replace('/'); });
    document.querySelector('#loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.querySelector('#submitButton');
      const status = document.querySelector('#status');
      button.disabled = true; status.textContent = '';
      try {
        const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: event.currentTarget.username.value, password: event.currentTarget.password.value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '登录失败');
        location.replace('/');
      } catch (error) { status.textContent = error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
